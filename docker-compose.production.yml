services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vhei
      POSTGRES_USER: vhei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database secret}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vhei -d vhei"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1536m
  api:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Erp: Host=db;Database=vhei;Username=vhei;Password=${POSTGRES_PASSWORD:?Set database secret}
      AllowedHosts: ${PUBLIC_HOST:?Set approved hostname}
      Seed__Mode: None
    depends_on: {db: {condition: service_healthy}}
    volumes: ["keys:/app/keys"]
    restart: unless-stopped
    mem_limit: 1536m
  web:
    build: {context: ., dockerfile: infrastructure/docker/web.Dockerfile}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 256m
volumes:
  postgres-data:
  keys:
