services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vhei
      POSTGRES_USER: vhei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vhei -d vhei"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1536m
    restart: unless-stopped
volumes:
  postgres-data:
